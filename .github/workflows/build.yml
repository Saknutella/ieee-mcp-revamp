name: build

# Builds and tests the single-file executable for every supported target.
#
# This workflow is the only way to produce a verified executable for a platform
# other than the one you are sitting at: a Node SEA binary is built by injecting
# the bundle into a copy of that platform's Node runtime, so it can only be
# executed — and therefore tested — on a runner of that platform.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One platform failing must not hide the result for the other.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            artifact: ieee-mcp-linux-amd64
          - os: windows-latest
            target: win32-x64
            artifact: ieee-mcp.exe
    steps:
      - uses: actions/checkout@v4

      # Pinned to the exact version the released binaries were built with;
      # the Node version is part of the reproducible-build inputs.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (${{ matrix.target }})
        run: node scripts/build.mjs

      # Runs against the packaged executable, not the sources, and consumes no
      # real API quota: every suite talks to a local mock server.
      - name: Test (${{ matrix.target }})
        run: node test/run-all.mjs

      - name: Summarise build and test results
        run: node scripts/ci-summary.mjs

      - name: Upload executable and checksums
        uses: actions/upload-artifact@v4
        with:
          name: ieee-mcp-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/${{ matrix.artifact }}
            dist/SHA256SUMS.txt
            dist/BUILD-INFO.json
            build/test-results.json
